<header class="header">
  <div class="container header-top">
    <a href="#" class="logo">
        <img loading="lazy" decoding="async" src="assets/d5f720099214.png" alt="Logo">
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html" data-route="home">Home</a>
      <a href="services.html" data-route="services">Services</a>
      <a href="about.html" data-route="about">About Us</a>
      <a href="contact.html" data-route="contact">Contact</a>
      <a href="orders.html">My Orders</a>
    </nav>
    <div class="search-box" id="desktopSearchWrap">
      <i class="fas fa-search s-icon" onclick="runProductSearch('desktopSearchInput')" style="cursor:pointer"></i>
      <span class="s-divider"></span>
      <input type="text" id="desktopSearchInput" placeholder="কী খুঁজছেন? যেমন: শার্ট, শাড়ি, কম্বল..." oninput="syncSearchInputs('desktopSearchInput', this.value)" onkeydown="if(event.key==='Enter') runProductSearch('desktopSearchInput')" />
      <i class="fas fa-times s-dots" id="desktopSearchClear" style="display:none" onclick="clearProductSearch('desktopSearchInput')"></i>
      <div class="search-suggest" id="desktopSearchSuggest"></div>
    </div>
    <div class="header-icons">
      <div class="icon-btn"><i class="fas fa-shopping-cart"></i><span class="cart-count">0</span><span>Cart</span></div>
      <div class="icon-btn" id="headerSignInBtn" onclick="window.location.href='account.html'"><i class="far fa-user"></i><span>Login</span></div>
    </div>
  </div>
  <nav class="cat-nav">
    <div class="container">
      <a href="#men-wear" data-cat="men-wear" onclick="return handleCategoryLinkClick(event,'men-wear')">Men's Wear</a>
      <a href="#women-wear" data-cat="women-wear" onclick="return handleCategoryLinkClick(event,'women-wear')">Women's Wear</a>
      <a href="#winter-wear" data-cat="winter-wear" onclick="return handleCategoryLinkClick(event,'winter-wear')">Winter Wear</a>
      <a href="#home-linen" data-cat="home-linen" onclick="return handleCategoryLinkClick(event,'home-linen')">Home Linen</a>
      <a href="#suits" data-cat="suits" onclick="return handleCategoryLinkClick(event,'suits')">Suits &amp; Panjabi</a>
    </div>
  </nav>
</header>
